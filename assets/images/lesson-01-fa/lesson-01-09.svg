<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" direction="rtl"><style>text{font-family:Tahoma,Arial,sans-serif;fill:#18202a}.h{font-weight:700;fill:#168b79}.s{font-size:16px}.m{font-size:20px}.b{font-size:24px;font-weight:700}.axis{stroke:#18202a;stroke-width:3}.g{stroke:#168b79;stroke-width:5;fill:none}.r{stroke:#d43d3d;stroke-width:5;fill:none}.thin{stroke:#18202a;stroke-width:2;fill:none}.node{fill:#dff5ef;stroke:#168b79;stroke-width:2}.hidden{fill:#e8f1fb;stroke:#2868a8;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="450" y="38" text-anchor="middle" class="b h">نقشهٔ مفهومی یادگیری عمیق</text><g class="m" text-anchor="middle"><rect x="40" y="95" width="185" height="90" rx="18" fill="#dff5ef" stroke="#168b79" stroke-width="3"/><text x="132" y="132">یادگیری ماشین</text><text x="132" y="160" class="s">رگرسیون و طبقه‌بندی</text><rect x="260" y="95" width="185" height="90" rx="18" fill="#e5f2ff" stroke="#2868a8" stroke-width="3"/><text x="352" y="132">شبکه‌های عصبی</text><text x="352" y="160" class="s">وزن‌ها و نورون‌ها</text><rect x="480" y="95" width="185" height="90" rx="18" fill="#fff1ef" stroke="#d43d3d" stroke-width="3"/><text x="572" y="132">فعال‌سازی نرم</text><text x="572" y="160" class="s">سیگموید و مشتق</text><rect x="700" y="95" width="165" height="90" rx="18" fill="#f3f0ff" stroke="#7250a8" stroke-width="3"/><text x="782" y="132">گرادیان نزولی</text><text x="782" y="160" class="s">بهینه‌سازی</text></g><path d="M225 140H260M445 140H480M665 140H700" class="axis"/><rect x="285" y="280" width="330" height="105" rx="22" fill="#eef6f3" stroke="#168b79" stroke-width="3"/><text x="450" y="325" text-anchor="middle" class="b">برنامه‌نویسی مشتق‌پذیر</text><text x="450" y="360" text-anchor="middle" class="s">ترکیب این ابزارها در مدل‌های عمیق‌تر</text><path d="M450 185V280" class="axis"/></svg>