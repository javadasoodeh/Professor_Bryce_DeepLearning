<svg xmlns="http://www.w3.org/2000/svg" aria-label="Side by side comparison of a hard step activation, whose derivative is zero on flat regions, and a smooth sigmoid activation that transitions continuously from 0 to 1." role="img" viewBox="0 0 980 360"><style>
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#24344d}
.mathtext{font-family:"Cambria Math","Times New Roman",serif}
.axis{stroke:#64748b;stroke-width:1.4}
.grid{stroke:#dfe6ef;stroke-width:1}
.curve{fill:none;stroke:#2563eb;stroke-width:4;stroke-linecap:round}
.curve2{fill:none;stroke:#0f9f8f;stroke-width:4;stroke-linecap:round}
.curve3{fill:none;stroke:#c2415d;stroke-width:3.5;stroke-linecap:round}
.softblue{fill:#eaf2ff}.softteal{fill:#e9f8f5}.softamber{fill:#fff5dd}.softrose{fill:#ffeef2}
</style>

<rect fill="#fff8f8" height="315" rx="20" stroke="#f0d6dc" width="450" x="20" y="20"></rect><rect fill="#f5fbff" height="315" rx="20" stroke="#d4e5f6" width="450" x="510" y="20"></rect>
<g transform="translate(0,0)"><line class="axis" stroke="#64748b" stroke-width="1.4" x1="70" x2="430" y1="280" y2="280"></line><line class="axis" stroke="#64748b" stroke-width="1.4" x1="250" x2="250" y1="300" y2="65"></line><text class="mathtext" font-family="Cambria Math, Times New Roman, serif" font-size="16" x="431" y="299">z</text><text class="mathtext" font-family="Cambria Math, Times New Roman, serif" font-size="16" x="258" y="70">a(z)</text><line stroke="#c2415d" stroke-width="4" x1="80" x2="250" y1="260" y2="260"></line><line stroke="#c2415d" stroke-width="4" x1="250" x2="420" y1="100" y2="100"></line><line stroke="#c2415d" stroke-dasharray="6 5" stroke-width="2.5" x1="250" x2="250" y1="260" y2="100"></line><text class="mathtext" fill="#c2415d" font-family="Cambria Math, Times New Roman, serif" font-size="19" x="116" y="87">a′(z)=0</text><text class="mathtext" fill="#c2415d" font-family="Cambria Math, Times New Roman, serif" font-size="19" x="322" y="87">a′(z)=0</text><circle cx="250" cy="100" fill="#c2415d" r="5"></circle><circle cx="250" cy="260" fill="#fff" r="5" stroke="#c2415d" stroke-width="2"></circle></g>
<g><line class="axis" stroke="#64748b" stroke-width="1.4" x1="560" x2="920" y1="280" y2="280"></line><line class="axis" stroke="#64748b" stroke-width="1.4" x1="740" x2="740" y1="300" y2="65"></line><text class="mathtext" font-family="Cambria Math, Times New Roman, serif" font-size="16" x="921" y="299">z</text><text class="mathtext" font-family="Cambria Math, Times New Roman, serif" font-size="16" x="748" y="70">σ(z)</text><path d="M570 255 C630 254 678 241 709 205 C728 183 737 161 740 180 C748 132 776 107 810 96 C843 85 878 82 910 82" fill="none" stroke="#2563eb" stroke-width="4"></path><line stroke="#94a3b8" stroke-dasharray="5 5" stroke-width="1.5" x1="740" x2="740" y1="280" y2="180"></line><line stroke="#94a3b8" stroke-dasharray="5 5" stroke-width="1.5" x1="560" x2="740" y1="180" y2="180"></line><circle cx="740" cy="180" fill="#2563eb" r="6"></circle><text class="mathtext" font-family="Cambria Math, Times New Roman, serif" font-size="16" x="750" y="171">σ(0)=0.5</text><text class="mathtext" fill="#0f9f8f" font-family="Cambria Math, Times New Roman, serif" font-size="17" x="600" y="92">σ′(z)>0</text></g>
</svg>