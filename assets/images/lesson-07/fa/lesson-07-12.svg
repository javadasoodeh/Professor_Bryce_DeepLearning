<svg viewBox="0 0 940 420" xmlns="http://www.w3.org/2000/svg"><rect width="940" height="420" rx="18" fill="#fbfbf9"></rect>
    <text class="label fa" x="470" y="40" text-anchor="middle" font-size="17">هر اتصال یک وزن دارد؛ هر نورونِ غیرورودی یک بایاس دارد.</text>
    <g transform="translate(45,85)">
      <rect x="0" y="0" width="240" height="220" rx="16" fill="#f3f6f8" stroke="#d9dfe0"></rect><text x="120" y="36" text-anchor="middle" font-size="18" font-weight="700">4 → 3</text><text x="120" y="84" text-anchor="middle" font-size="31" font-weight="800" fill="#23445f">4×3 = 12</text><text x="120" y="115" text-anchor="middle" class="small muted fa">وزن‌ها</text><text x="120" y="164" text-anchor="middle" font-size="26" font-weight="800" fill="#177a78">+ 3</text><text x="120" y="192" text-anchor="middle" class="small muted fa">بایاس‌ها</text>
      <rect x="300" y="0" width="240" height="220" rx="16" fill="#eef6f4" stroke="#d3e4e1"></rect><text x="420" y="36" text-anchor="middle" font-size="18" font-weight="700">3 → 3</text><text x="420" y="84" text-anchor="middle" font-size="31" font-weight="800" fill="#23445f">3×3 = 9</text><text x="420" y="115" text-anchor="middle" class="small muted fa">وزن‌ها</text><text x="420" y="164" text-anchor="middle" font-size="26" font-weight="800" fill="#177a78">+ 3</text><text x="420" y="192" text-anchor="middle" class="small muted fa">بایاس‌ها</text>
      <rect x="600" y="0" width="240" height="220" rx="16" fill="#fbf2e9" stroke="#ead8c4"></rect><text x="720" y="36" text-anchor="middle" font-size="18" font-weight="700">3 → 2</text><text x="720" y="84" text-anchor="middle" font-size="31" font-weight="800" fill="#23445f">3×2 = 6</text><text x="720" y="115" text-anchor="middle" class="small muted fa">وزن‌ها</text><text x="720" y="164" text-anchor="middle" font-size="26" font-weight="800" fill="#177a78">+ 2</text><text x="720" y="192" text-anchor="middle" class="small muted fa">بایاس‌ها</text>
    </g>
    <rect x="205" y="334" width="530" height="56" rx="14" fill="#edf4f7" stroke="#cad9df"></rect><text class="fa" x="470" y="370" text-anchor="middle" font-size="22" font-weight="800">۲۷ وزن + ۸ بایاس = ۳۵ پارامتر</text>
    </svg>