<svg viewBox="0 0 680 230" xmlns="http://www.w3.org/2000/svg" style="width:100%; max-width:680px; height:auto; display:block; margin:auto; background:#ffffff; border:1px solid #e2e8f0; border-radius:8px;">
  <style>
    .card-title { font-family: system-ui, sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; }
    .dim-lbl { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #0369a1; }
    .math-eq { font-family: "DejaVu Serif", "Times New Roman", serif; font-style: italic; font-weight: bold; }
    .card-desc { font-family: system-ui, sans-serif; font-size: 10px; fill: #475569; }
  </style>

  <!-- Panel 1: 1D Input -->
  <g transform="translate(15, 20)">
    <rect x="0" y="0" width="150" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="75" y="24" text-anchor="middle" class="card-title">1D Input</text>
    <text x="75" y="42" text-anchor="middle" class="dim-lbl">Boundary = Point</text>
    <!-- Number line -->
    <line x1="15" y1="95" x2="135" y2="95" stroke="#64748b" stroke-width="1.8" />
    <polygon points="135,92 142,95 135,98" fill="#64748b" />
    <polygon points="15,92 8,95 15,98" fill="#64748b" />
    <!-- Threshold point -->
    <line x1="75" y1="80" x2="75" y2="110" stroke="#dc2626" stroke-width="2.5" />
    <circle cx="75" cy="95" r="4" fill="#dc2626" />
    <text x="40" y="85" class="math-eq" fill="#0284c7" font-size="12px">y = 0</text>
    <text x="95" y="85" class="math-eq" fill="#059669" font-size="12px">y = 1</text>
    <text x="75" y="125" text-anchor="middle" class="math-eq" fill="#dc2626" font-size="11px">x₁ = -b / w₁</text>
    <text x="75" y="155" text-anchor="middle" class="card-desc">A single threshold</text>
    <text x="75" y="170" text-anchor="middle" class="card-desc">point splits the line.</text>
  </g>

  <!-- Panel 2: 2D Input -->
  <g transform="translate(180, 20)">
    <rect x="0" y="0" width="150" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="75" y="24" text-anchor="middle" class="card-title">2D Input</text>
    <text x="75" y="42" text-anchor="middle" class="dim-lbl">Boundary = Line</text>
    <!-- 2D Axes -->
    <line x1="20" y1="105" x2="130" y2="105" stroke="#64748b" stroke-width="1.4" />
    <line x1="75" y1="145" x2="75" y2="55" stroke="#64748b" stroke-width="1.4" />
    <!-- Line boundary -->
    <line x1="35" y1="135" x2="115" y2="65" stroke="#dc2626" stroke-width="2" />
    <text x="40" y="75" class="math-eq" fill="#0284c7" font-size="10px">y = 0</text>
    <text x="105" y="125" class="math-eq" fill="#059669" font-size="10px">y = 1</text>
    <text x="75" y="155" text-anchor="middle" class="card-desc">A 1D line partitions</text>
    <text x="75" y="170" text-anchor="middle" class="card-desc">the 2D feature plane.</text>
  </g>

  <!-- Panel 3: 3D Input -->
  <g transform="translate(345, 20)">
    <rect x="0" y="0" width="150" height="190" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="75" y="24" text-anchor="middle" class="card-title">3D Input</text>
    <text x="75" y="42" text-anchor="middle" class="dim-lbl">Boundary = Plane</text>
    <!-- 3D Axes -->
    <line x1="75" y1="105" x2="135" y2="105" stroke="#64748b" stroke-width="1.4" />
    <line x1="75" y1="105" x2="75" y2="55" stroke="#64748b" stroke-width="1.4" />
    <line x1="75" y1="105" x2="35" y2="135" stroke="#64748b" stroke-width="1.4" />
    <!-- Tilted Plane -->
    <polygon points="45,95 105,75 120,115 60,135" fill="#fee2e2" fill-opacity="0.6" stroke="#dc2626" stroke-width="1.6" />
    <text x="75" y="155" text-anchor="middle" class="card-desc">A 2D flat plane splits</text>
    <text x="75" y="170" text-anchor="middle" class="card-desc">3D continuous space.</text>
  </g>

  <!-- Panel 4: n-D Input -->
  <g transform="translate(510, 20)">
    <rect x="0" y="0" width="155" height="190" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4" />
    <text x="77" y="24" text-anchor="middle" class="card-title" fill="#1e40af">n-D Input</text>
    <text x="77" y="42" text-anchor="middle" class="dim-lbl" fill="#1d4ed8">Boundary = Hyperplane</text>
    <rect x="20" y="65" width="115" height="60" rx="4" fill="#ffffff" stroke="#bfdbfe" />
    <text x="77" y="90" text-anchor="middle" class="math-eq" fill="#0f172a" font-size="12px">w⃗ · x⃗ + b = 0</text>
    <text x="77" y="112" text-anchor="middle" font-family="system-ui" font-size="10px" font-weight="bold" fill="#dc2626">(n−1) Dimensions</text>
    <text x="77" y="152" text-anchor="middle" class="card-desc">Splits ℝⁿ space into two</text>
    <text x="77" y="167" text-anchor="middle" class="card-desc">opposing half-spaces</text>
    <text x="77" y="180" text-anchor="middle" class="card-desc">(y = 0 vs. y = 1).</text>
  </g>
</svg>
