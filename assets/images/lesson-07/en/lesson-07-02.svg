<svg viewBox="0 0 940 360" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 10 10" refx="9" refy="5" markerwidth="7" markerheight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#577385"></path></marker></defs>
    <rect width="940" height="360" rx="18" fill="#fbfbf9"></rect>
    <text class="label " x="145" y="44" text-anchor="middle" font-size="17">Activations from previous layer</text>
    <g font-size="17" font-weight="700"><circle cx="90" cy="105" r="24" class="node-hidden"></circle><text x="90" y="111" text-anchor="middle">a₅</text><circle cx="90" cy="180" r="24" class="node-hidden"></circle><text x="90" y="186" text-anchor="middle">a₆</text><circle cx="90" cy="255" r="24" class="node-hidden"></circle><text x="90" y="261" text-anchor="middle">a₇</text></g>
    <path class="flow" d="M115 105 C180 105 205 135 270 155"></path><path class="flow" d="M115 180 L270 180"></path><path class="flow" d="M115 255 C180 255 205 225 270 205"></path>
    <text class="tiny muted" x="175" y="91">w₅→₈</text><text class="tiny muted" x="172" y="170">w₆→₈</text><text class="tiny muted" x="175" y="248">w₇→₈</text>
    <rect x="285" y="125" width="235" height="110" rx="18" fill="#eef5f4" stroke="#9ac7c1" stroke-width="2"></rect><text class="label " x="402" y="155" text-anchor="middle" font-size="17">weighted sum</text><text x="402" y="192" text-anchor="middle" font-size="20" font-family="Cambria Math,serif">x₈ = b₈ + Σ aᵢwᵢ→₈</text><text x="402" y="216" text-anchor="middle" class="small muted">i = 5, 6, 7</text>
    <path class="flow" d="M520 180 L625 180"></path>
    <rect x="640" y="125" width="145" height="110" rx="55" fill="#f7efe9" stroke="#d6ad83" stroke-width="2"></rect><text class="label " x="712" y="154" text-anchor="middle" font-size="16">activation</text><text x="712" y="190" text-anchor="middle" font-size="22" font-family="Cambria Math,serif">a₈=f₈(x₈)</text>
    <path class="flow" d="M785 180 L870 180"></path><text class="small muted " x="828" y="158" text-anchor="middle">sent forward</text>
    <circle cx="890" cy="180" r="28" class="node-hi"></circle><text x="890" y="186" text-anchor="middle" font-size="18" font-weight="700">a₈</text>
    <text class="small muted " x="470" y="320" text-anchor="middle">Every non-input neuron repeats these same two operations.</text>
