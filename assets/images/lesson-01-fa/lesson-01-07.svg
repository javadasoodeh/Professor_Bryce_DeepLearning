<svg viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg" direction="rtl"><style>text{font-family:Tahoma,Arial,sans-serif;fill:#18202a}.h{font-weight:700;fill:#168b79}.s{font-size:16px}.m{font-size:20px}.b{font-size:24px;font-weight:700}.axis{stroke:#18202a;stroke-width:3}.g{stroke:#168b79;stroke-width:5;fill:none}.r{stroke:#d43d3d;stroke-width:5;fill:none}.thin{stroke:#18202a;stroke-width:2;fill:none}.node{fill:#dff5ef;stroke:#168b79;stroke-width:2}.hidden{fill:#e8f1fb;stroke:#2868a8;stroke-width:2}</style><rect width="100%" height="100%" fill="white"/><text x="410" y="38" text-anchor="middle" class="b h">تابع پله‌ای و تابع سیگموید</text><g transform="translate(40,80)"><text x="180" y="20" text-anchor="middle" class="m">تابع پله‌ای</text><path d="M35 260V60M35 260H340" class="axis"/><path d="M45 250H180V110H325" class="g"/><text x="185" y="290" text-anchor="middle" class="s">مشتق تقریباً همه‌جا صفر و در آستانه تعریف‌نشده است.</text></g><g transform="translate(440,80)"><text x="180" y="20" text-anchor="middle" class="m">سیگموید</text><path d="M35 260V60M35 260H340" class="axis"/><path d="M45 245 C100 245 130 230 165 195 C210 150 240 110 325 100" class="r"/><text x="185" y="290" text-anchor="middle" class="s">σ(x)=1/(1+e^{-x}) — نرم و مشتق‌پذیر</text></g></svg>