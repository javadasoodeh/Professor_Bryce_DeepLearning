name: Generate lesson 03 PNG assets

on:
  push:
    branches:
      - lesson03-png-en-fa
    paths:
      - 'tools/generate_lesson03_png.py'
      - '.github/workflows/generate-lesson03-png.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lesson03-png-en-fa
          fetch-depth: 0
      - name: Install Pillow and Persian fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil fonts-noto-core fonts-noto-extra
      - name: Generate PNGs
        run: python3 tools/generate_lesson03_png.py
      - name: Commit generated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/gemini-videos-01-03/png-fa assets/images/gemini-videos-01-03/png-en
          if git diff --cached --quiet; then
            echo 'No image changes.'
            exit 0
          fi
          git commit -m 'Generate lesson 03 PNG assets'
          git push origin HEAD:lesson03-png-en-fa
