<svg viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" style="width:100%; max-width:680px; height:auto; display:block; margin:auto; background:#ffffff; border:1px solid #e2e8f0; border-radius:8px;">
  <style>
    .panel-header { font-family: system-ui, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; }
    .math-sym { font-family: "DejaVu Serif", "Times New Roman", serif; font-style: italic; font-weight: bold; }
    .sub-desc { font-family: system-ui, sans-serif; font-size: 11px; fill: #475569; }
  </style>

  <!-- Left: Schematic of 1-Input Linear Neuron -->
  <g transform="translate(30, 20)">
    <text x="130" y="15" text-anchor="middle" class="panel-header">1D Linear Neuron Model</text>
    <!-- x1 input -->
    <text x="15" y="85" class="math-sym" fill="#0f172a" font-size="15px">x₁</text>
    <line x1="35" y1="80" x2="110" y2="80" stroke="#0f172a" stroke-width="2" />
    <polygon points="108,77 114,80 108,83" fill="#0f172a" />
    <text x="65" y="70" class="math-sym" fill="#dc2626" font-size="13px">w₁</text>
    <!-- Bias arrow -->
    <text x="130" y="28" class="math-sym" fill="#dc2626" font-size="13px">b</text>
    <line x1="130" y1="32" x2="130" y2="58" stroke="#dc2626" stroke-width="2" />
    <polygon points="127,58 130,64 133,58" fill="#dc2626" />
    <!-- Node -->
    <circle cx="130" cy="80" r="22" fill="#ffffff" stroke="#0f172a" stroke-width="2.2" />
    <!-- Linear glyph inside circle -->
    <line x1="116" y1="94" x2="144" y2="66" stroke="#0284c7" stroke-width="2.2" />
    <polygon points="140,65 146,64 145,70" fill="#0284c7" />
    <polygon points="120,95 114,96 115,90" fill="#0284c7" />
    <!-- Output -->
    <line x1="152" y1="80" x2="205" y2="80" stroke="#059669" stroke-width="2" />
    <polygon points="205,77 211,80 205,83" fill="#059669" />
    <text x="220" y="85" class="math-sym" fill="#059669" font-size="16px">y</text>
    
    <!-- Computational Steps -->
    <rect x="10" y="125" width="240" height="120" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="22" y="150" font-family="system-ui" font-size="12px" font-weight="bold" fill="#0f172a">Mathematical Formulation:</text>
    <text x="22" y="174" class="math-sym" fill="#0f172a" font-size="13px">x = x₁w₁ + b</text>
    <text x="125" y="174" class="sub-desc">(Weighted input sum)</text>
    <text x="22" y="198" class="math-sym" fill="#059669" font-size="13px">y = x</text>
    <text x="80" y="198" class="sub-desc">(Identity linear activation)</text>
    <text x="22" y="224" class="math-sym" fill="#1e40af" font-size="13px">⇒ y = w₁x₁ + b</text>
  </g>

  <!-- Right: Cartesian Plot for w1=3, b=-2 -->
  <g transform="translate(340, 20)">
    <text x="160" y="15" text-anchor="middle" class="panel-header">Continuous Output Function (Regression)</text>
    <!-- Axes Grid Box -->
    <g transform="translate(30, 20)">
      <!-- Axes -->
      <line x1="20" y1="120" x2="260" y2="120" stroke="#64748b" stroke-width="1.8" />
      <line x1="110" y1="210" x2="110" y2="10" stroke="#64748b" stroke-width="1.8" />
      <!-- Axis Labels -->
      <text x="268" y="124" class="math-sym" fill="#475569" font-size="12px">x₁</text>
      <text x="106" y="5" class="math-sym" fill="#059669" font-size="14px">y</text>
      <!-- Tick Marks -->
      <line x1="80" y1="117" x2="80" y2="123" stroke="#64748b" />
      <line x1="140" y1="117" x2="140" y2="123" stroke="#64748b" />
      <line x1="170" y1="117" x2="170" y2="123" stroke="#64748b" />
      <line x1="200" y1="117" x2="200" y2="123" stroke="#64748b" />
      <line x1="107" y1="90" x2="113" y2="90" stroke="#64748b" />
      <line x1="107" y1="60" x2="113" y2="60" stroke="#64748b" />
      <line x1="107" y1="150" x2="113" y2="150" stroke="#64748b" />
      <line x1="107" y1="180" x2="113" y2="180" stroke="#64748b" />
      <text x="96" y="184" font-family="system-ui" font-size="10px" fill="#64748b">-2</text>
      
      <!-- Regression Line: y = 3x1 - 2. x1=0 -> y=-2 (110, 180). x1=2 -> y=4 (170, 0) -->
      <line x1="60" y1="230" x2="180" y2="10" stroke="#dc2626" stroke-width="2.5" />
      <text x="145" y="25" class="math-sym" fill="#dc2626" font-size="13px">y = 3x₁ − 2</text>
      
      <!-- Scatter Data Points & Residuals -->
      <!-- Point 1 -->
      <circle cx="75" cy="160" r="3" fill="#dc2626" />
      <line x1="75" y1="160" x2="75" y2="200" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 2" />
      <!-- Point 2 -->
      <circle cx="95" cy="130" r="3" fill="#dc2626" />
      <line x1="95" y1="130" x2="95" y2="155" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 2" />
      <!-- Point 3 -->
      <circle cx="130" cy="150" r="3" fill="#dc2626" />
      <line x1="130" y1="150" x2="130" y2="100" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 2" />
      <!-- Point 4 -->
      <circle cx="145" cy="40" r="3" fill="#dc2626" />
      <line x1="145" y1="40" x2="145" y2="80" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 2" />
      <!-- Point 5 -->
      <circle cx="170" cy="85" r="3" fill="#dc2626" />
      <line x1="170" y1="85" x2="170" y2="30" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 2" />

      <!-- Annotations -->
      <text x="10" y="228" class="math-sym" fill="#dc2626" font-size="11.5px">Example: w₁ = 3,  b = -2</text>
    </g>
  </g>
</svg>
