<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <title>Single neuron computation</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f3d75"/>
    </marker>
    <style>
      .bg { fill:#fbfdff; }
      .panel { fill:#f4f9ff; stroke:#a7c9ee; stroke-width:2; }
      .panel2 { fill:#fffaf2; stroke:#efc47d; stroke-width:2; }
      .title { font:700 30px Arial,sans-serif; fill:#0b2f5b; }
      .h { font:700 22px Arial,sans-serif; fill:#0b2f5b; }
      .t { font:18px Arial,sans-serif; fill:#1f3550; }
      .small { font:16px Arial,sans-serif; fill:#37536f; }
      .math { font:26px "Times New Roman",serif; fill:#111827; }
      .maths { font:21px "Times New Roman",serif; fill:#111827; }
      .line { stroke:#0f3d75; stroke-width:3; fill:none; }
      .soft { stroke:#8fa9c2; stroke-width:2; fill:none; }
      .accent { fill:#e7f3ff; stroke:#2f80d1; stroke-width:3; }
      .orange { fill:#fff1dc; stroke:#e67e22; stroke-width:3; }
      .label { font:700 18px Arial,sans-serif; fill:#0f3d75; }
      .rtl { direction:rtl; unicode-bidi:bidi-override; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="650"/>
  
<text x="600" y="48" text-anchor="middle" class="title">محاسبه‌ی یک نورون منفرد</text>
<rect x="36" y="82" width="1128" height="520" rx="18" class="panel"/>
<text x="170" y="122" text-anchor="middle" class="h">از یک شبکه...</text>
<g class="soft">
  <line x1="90" y1="190" x2="200" y2="165"/><line x1="90" y1="190" x2="200" y2="245"/><line x1="90" y1="280" x2="200" y2="165"/><line x1="90" y1="280" x2="200" y2="245"/>
  <line x1="200" y1="165" x2="305" y2="205"/><line x1="200" y1="245" x2="305" y2="205"/><line x1="200" y1="165" x2="305" y2="300"/><line x1="200" y1="245" x2="305" y2="300"/>
</g>
<g fill="#ffffff" stroke="#406a98" stroke-width="3">
  <circle cx="90" cy="190" r="18"/><circle cx="90" cy="280" r="18"/>
  <circle cx="200" cy="165" r="18"/><circle cx="200" cy="245" r="18"/>
  <circle cx="305" cy="205" r="18"/><circle cx="305" cy="300" r="18"/>
</g>
<circle cx="200" cy="245" r="28" fill="none" stroke="#2f80d1" stroke-width="4" stroke-dasharray="7 6"/>
<path d="M228 245 C300 250,350 250,410 250" class="line" marker-end="url(#arrow)"/>
<text x="250" y="340" class="small rtl">روی یک نورون زوم می‌کنیم</text>
<text x="635" y="122" text-anchor="middle" class="h">...به محاسبه‌ی همان یک نورون</text>
<text x="445" y="190" class="math">x₁</text><circle cx="490" cy="184" r="18" class="accent"/>
<text x="445" y="275" class="math">x₂</text><circle cx="490" cy="269" r="18" class="accent"/>
<text x="445" y="360" class="math">xₙ</text><circle cx="490" cy="354" r="18" class="accent"/>
<line x1="508" y1="184" x2="650" y2="245" class="line" marker-end="url(#arrow)"/>
<line x1="508" y1="269" x2="650" y2="269" class="line" marker-end="url(#arrow)"/>
<line x1="508" y1="354" x2="650" y2="295" class="line" marker-end="url(#arrow)"/>
<text x="560" y="192" class="maths">w₁</text><text x="560" y="258" class="maths">w₂</text><text x="560" y="345" class="maths">wₙ</text>
<circle cx="720" cy="270" r="78" class="accent"/>
<text x="720" y="282" text-anchor="middle" class="math" font-size="42">Σ</text>
<text x="720" y="170" text-anchor="middle" class="maths">b</text>
<line x1="720" y1="180" x2="720" y2="192" class="line" marker-end="url(#arrow)"/>
<line x1="798" y1="270" x2="885" y2="270" class="line" marker-end="url(#arrow)"/>
<text x="840" y="250" class="maths">z</text>
<rect x="890" y="220" width="120" height="100" rx="14" class="orange"/>
<text x="950" y="282" text-anchor="middle" class="math">f(z)</text>
<line x1="1010" y1="270" x2="1090" y2="270" class="line" marker-end="url(#arrow)"/>
<text x="1110" y="278" class="math">y</text>
<rect x="375" y="430" width="750" height="120" rx="14" fill="#ffffff" stroke="#c7d8e9" stroke-width="2"/>
<text x="750" y="472" text-anchor="middle" class="math">z = b + Σᵢ wᵢxᵢ</text>
<text x="750" y="515" text-anchor="middle" class="math">y = f(z)</text>
<text x="750" y="548" text-anchor="middle" class="small rtl">ابتدا جمع وزن‌دار + بایاس، سپس تابع فعال‌سازی</text>

</svg>