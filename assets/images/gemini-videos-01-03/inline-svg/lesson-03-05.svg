<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <title>One-dimensional decision boundary</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#0f3d75"/></marker>
    <style>.bg{fill:#fbfdff}.panel{fill:#f4f9ff;stroke:#a7c9ee;stroke-width:2}.panel2{fill:#fffaf2;stroke:#efc47d;stroke-width:2}.title{font:700 30px Arial,sans-serif;fill:#0b2f5b}.h{font:700 22px Arial,sans-serif;fill:#0b2f5b}.small{font:16px Arial,sans-serif;fill:#37536f}.math{font:26px "Times New Roman",serif;fill:#111827}.maths{font:21px "Times New Roman",serif;fill:#111827}.line{stroke:#0f3d75;stroke-width:3;fill:none}.label{font:700 18px Arial,sans-serif;fill:#0f3d75}.rtl{direction:rtl;unicode-bidi:bidi-override}</style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="650"/>
<text x="600" y="48" text-anchor="middle" class="title">اگر فقط یک ورودی داشته باشیم چه می‌شود؟</text>
<rect x="36" y="82" width="1128" height="520" rx="18" class="panel"/>
<text x="600" y="135" text-anchor="middle" class="h">در یک بُعد، مرز تصمیم دیگر «خط» نیست؛ یک «نقطه» است</text>
<rect x="95" y="180" width="410" height="130" rx="14" fill="#ffffff" stroke="#c7d8e9" stroke-width="2"/>
<text x="300" y="225" text-anchor="middle" class="math">z = 2x₁ + 1</text><text x="300" y="270" text-anchor="middle" class="maths">z = 0  ⇒  x₁ = −0.5</text>
<line x1="135" y1="430" x2="1070" y2="430" class="line" marker-end="url(#arrow)"/>
<line x1="600" y1="375" x2="600" y2="475" stroke="#e67e22" stroke-width="5"/><circle cx="600" cy="430" r="14" fill="#ffffff" stroke="#e67e22" stroke-width="5"/>
<text x="600" y="350" text-anchor="middle" class="label">مرز: x₁ = −0.5</text><text x="355" y="390" text-anchor="middle" class="h">y = 0</text><text x="845" y="390" text-anchor="middle" class="h">y = 1</text>
<text x="145" y="465" class="small">کمتر</text><text x="1010" y="465" class="small">بیشتر</text>
<rect x="220" y="505" width="760" height="62" rx="12" class="panel2"/><text x="600" y="545" text-anchor="middle" class="small rtl">همان قاعده: محل تغییر کلاس جایی است که جمع وزن‌دار + بایاس برابر صفر می‌شود</text>
</svg>