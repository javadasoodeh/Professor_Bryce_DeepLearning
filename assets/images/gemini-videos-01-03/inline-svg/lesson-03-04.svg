<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <title>Decision boundary for binary classifier</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#0f3d75"/></marker>
    <style>.bg{fill:#fbfdff}.panel{fill:#f4f9ff;stroke:#a7c9ee;stroke-width:2}.title{font:700 30px Arial,sans-serif;fill:#0b2f5b}.h{font:700 22px Arial,sans-serif;fill:#0b2f5b}.small{font:16px Arial,sans-serif;fill:#37536f}.math{font:26px "Times New Roman",serif;fill:#111827}.maths{font:21px "Times New Roman",serif;fill:#111827}.line{stroke:#0f3d75;stroke-width:3;fill:none}.soft{stroke:#8fa9c2;stroke-width:2;fill:none}.label{font:700 18px Arial,sans-serif;fill:#0f3d75}.rtl{direction:rtl;unicode-bidi:bidi-override}</style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="650"/>
<text x="600" y="48" text-anchor="middle" class="title">مرز تصمیم: جایی که خروجی عوض می‌شود</text>
<rect x="36" y="82" width="1128" height="520" rx="18" class="panel"/>
<rect x="70" y="125" width="390" height="420" rx="16" fill="#ffffff" stroke="#c7d8e9" stroke-width="2"/>
<text x="265" y="168" text-anchor="middle" class="h">پارامترهای مثال</text>
<text x="120" y="220" class="maths">w₁ = 2</text><text x="120" y="260" class="maths">w₂ = −1</text><text x="120" y="300" class="maths">b = 1</text>
<text x="120" y="360" class="math">z = 2x₁ − x₂ + 1</text><text x="120" y="425" class="maths">مرز:  z = 0</text><text x="120" y="465" class="maths">2x₁ − x₂ + 1 = 0</text><text x="120" y="505" class="maths">x₂ = 2x₁ + 1</text>
<rect x="500" y="125" width="620" height="420" rx="16" fill="#ffffff" stroke="#c7d8e9" stroke-width="2"/>
<line x1="580" y1="475" x2="1060" y2="475" class="soft" marker-end="url(#arrow)"/><line x1="720" y1="515" x2="720" y2="165" class="soft" marker-end="url(#arrow)"/>
<text x="1040" y="505" class="maths">x₁</text><text x="680" y="190" class="maths">x₂</text>
<line x1="610" y1="520" x2="930" y2="165" stroke="#2f80d1" stroke-width="5"/><text x="805" y="210" class="label">2x₁ − x₂ + 1 = 0</text>
<g fill="#2f80d1"><circle cx="620" cy="260" r="9"/><circle cx="675" cy="215" r="9"/><circle cx="700" cy="330" r="9"/><circle cx="760" cy="245" r="9"/></g>
<g stroke="#e67e22" stroke-width="5"><line x1="760" y1="410" x2="778" y2="428"/><line x1="778" y1="410" x2="760" y2="428"/><line x1="850" y1="355" x2="868" y2="373"/><line x1="868" y1="355" x2="850" y2="373"/><line x1="930" y1="405" x2="948" y2="423"/><line x1="948" y1="405" x2="930" y2="423"/><line x1="1000" y1="315" x2="1018" y2="333"/><line x1="1018" y1="315" x2="1000" y2="333"/></g>
<text x="575" y="195" class="label">y = 0</text><text x="995" y="460" class="label" fill="#e67e22">y = 1</text>
<text x="810" y="580" text-anchor="middle" class="small rtl">یک سمت خط z≤0 است و سمت دیگر z&gt;0</text>
</svg>