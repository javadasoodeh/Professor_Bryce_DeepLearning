<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <title>Regression with one neuron</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#0f3d75"/></marker>
    <style>.bg{fill:#fbfdff}.panel{fill:#f4f9ff;stroke:#a7c9ee;stroke-width:2}.title{font:700 30px Arial,sans-serif;fill:#0b2f5b}.h{font:700 22px Arial,sans-serif;fill:#0b2f5b}.small{font:16px Arial,sans-serif;fill:#37536f}.math{font:26px "Times New Roman",serif;fill:#111827}.maths{font:21px "Times New Roman",serif;fill:#111827}.line{stroke:#0f3d75;stroke-width:3;fill:none}.soft{stroke:#8fa9c2;stroke-width:2;fill:none}.accent{fill:#e7f3ff;stroke:#2f80d1;stroke-width:3}.orange{fill:#fff1dc;stroke:#e67e22;stroke-width:3}.rtl{direction:rtl;unicode-bidi:bidi-override}</style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="650"/>
<text x="600" y="48" text-anchor="middle" class="title">یک نورون برای رگرسیون</text>
<rect x="36" y="82" width="1128" height="520" rx="18" class="panel"/>
<text x="270" y="125" text-anchor="middle" class="h">۱) فعال‌سازی خطی</text>
<text x="105" y="220" class="math">x₁</text><circle cx="160" cy="212" r="20" class="accent"/>
<line x1="180" y1="212" x2="330" y2="212" class="line" marker-end="url(#arrow)"/><text x="235" y="195" class="maths">w₁</text>
<circle cx="400" cy="212" r="70" class="accent"/><text x="400" y="223" text-anchor="middle" class="math">Σ</text>
<text x="400" y="125" text-anchor="middle" class="maths">b</text><line x1="400" y1="137" x2="400" y2="142" class="line" marker-end="url(#arrow)"/>
<line x1="470" y1="212" x2="540" y2="212" class="line" marker-end="url(#arrow)"/>
<rect x="545" y="170" width="150" height="84" rx="12" class="orange"/><text x="620" y="222" text-anchor="middle" class="math">f(z)=z</text>
<line x1="695" y1="212" x2="760" y2="212" class="line" marker-end="url(#arrow)"/><text x="780" y="220" class="math">y</text>
<text x="430" y="330" text-anchor="middle" class="math">y = w₁x₁ + b</text>
<text x="905" y="125" text-anchor="middle" class="h">۲) مثال درس</text>
<line x1="830" y1="410" x2="1110" y2="410" class="soft" marker-end="url(#arrow)"/><line x1="930" y1="525" x2="930" y2="285" class="soft" marker-end="url(#arrow)"/>
<text x="1090" y="438" class="maths">x₁</text><text x="900" y="300" class="maths">y</text>
<line x1="845" y1="500" x2="1080" y2="305" stroke="#2f80d1" stroke-width="5"/>
<circle cx="930" cy="430" r="7" fill="#e67e22"/><text x="948" y="438" class="small">b = −2</text>
<circle cx="1000" cy="370" r="7" fill="#2f80d1"/><text x="1015" y="365" class="small">شیب = w₁ = 3</text>
<rect x="690" y="450" width="360" height="90" rx="12" fill="#ffffff" stroke="#c7d8e9"/>
<text x="870" y="485" text-anchor="middle" class="maths">w₁ = 3 ,  b = −2</text><text x="870" y="520" text-anchor="middle" class="math">y = 3x₁ − 2</text>
</svg>