<svg viewBox="0 0 940 390" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 10 10" refx="9" refy="5" markerwidth="7" markerheight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#577385"></path></marker></defs><rect width="940" height="390" rx="18" fill="#fbfbf9"></rect>
    <rect x="60" y="70" width="205" height="105" rx="16" fill="#f3f6f8" stroke="#cfd8d9"></rect><text class="label " x="162" y="102" text-anchor="middle" font-size="16">current parameters</text><text x="162" y="143" text-anchor="middle" font-size="23" font-family="Cambria Math,serif">θ ∈ ℝ³⁵</text>
    <rect x="60" y="220" width="205" height="105" rx="16" fill="#f8f3fa" stroke="#ded4e8"></rect><text class="label " x="162" y="252" text-anchor="middle" font-size="16">gradient of loss</text><text x="162" y="293" text-anchor="middle" font-size="23" font-family="Cambria Math,serif">∇L(θ) ∈ ℝ³⁵</text>
    <path class="flow" d="M265 122 C330 122 325 180 390 190"></path><path class="flow" d="M265 272 C330 272 325 218 390 208"></path>
    <rect x="405" y="135" width="270" height="125" rx="18" fill="#fff8e9" stroke="#ead8ad"></rect><text class="label " x="540" y="170" text-anchor="middle" font-size="16">update rule</text><text x="540" y="217" text-anchor="middle" font-size="23" font-family="Cambria Math,serif">θ_new = θ − η∇L(θ)</text>
    <path class="flow" d="M675 198 L735 198"></path>
    <rect x="750" y="143" width="140" height="110" rx="16" fill="#edf6f4" stroke="#c8dfda"></rect><text class="label " x="820" y="174" text-anchor="middle" font-size="16">new parameters</text><text x="820" y="216" text-anchor="middle" font-size="22" font-family="Cambria Math,serif">θ_new</text>
    <text class="muted small " x="470" y="355" text-anchor="middle">η is the step size (learning rate).</text></svg>