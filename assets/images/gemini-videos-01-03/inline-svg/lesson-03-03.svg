<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <title>Binary classification with step activation</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#0f3d75"/></marker>
    <style>.bg{fill:#fbfdff}.panel{fill:#f4f9ff;stroke:#a7c9ee;stroke-width:2}.title{font:700 30px Arial,sans-serif;fill:#0b2f5b}.h{font:700 22px Arial,sans-serif;fill:#0b2f5b}.small{font:16px Arial,sans-serif;fill:#37536f}.math{font:26px "Times New Roman",serif;fill:#111827}.maths{font:21px "Times New Roman",serif;fill:#111827}.line{stroke:#0f3d75;stroke-width:3;fill:none}.accent{fill:#e7f3ff;stroke:#2f80d1;stroke-width:3}.orange{fill:#fff1dc;stroke:#e67e22;stroke-width:3}.rtl{direction:rtl;unicode-bidi:bidi-override}</style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="650"/>
<text x="600" y="48" text-anchor="middle" class="title">همان نورون، این‌بار برای طبقه‌بندی</text>
<rect x="36" y="82" width="1128" height="520" rx="18" class="panel"/>
<text x="600" y="125" text-anchor="middle" class="h">جمع وزن‌دار همان است؛ فقط تابع فعال‌سازی عوض می‌شود</text>
<text x="115" y="210" class="math">x₁</text><circle cx="165" cy="202" r="20" class="accent"/>
<text x="115" y="330" class="math">x₂</text><circle cx="165" cy="322" r="20" class="accent"/>
<line x1="185" y1="202" x2="375" y2="247" class="line" marker-end="url(#arrow)"/><line x1="185" y1="322" x2="375" y2="277" class="line" marker-end="url(#arrow)"/>
<text x="260" y="205" class="maths">w₁</text><text x="260" y="315" class="maths">w₂</text>
<circle cx="445" cy="262" r="72" class="accent"/><text x="445" y="275" text-anchor="middle" class="math">Σ</text>
<text x="445" y="170" text-anchor="middle" class="maths">b</text><line x1="445" y1="180" x2="445" y2="190" class="line" marker-end="url(#arrow)"/>
<line x1="517" y1="262" x2="615" y2="262" class="line" marker-end="url(#arrow)"/><text x="560" y="242" class="maths">z</text>
<rect x="620" y="190" width="190" height="145" rx="16" class="orange"/><path d="M655 285 H705 V230 H770" stroke="#e67e22" stroke-width="5" fill="none"/>
<text x="715" y="170" text-anchor="middle" class="h">تابع پله‌ای</text>
<line x1="810" y1="262" x2="900" y2="262" class="line" marker-end="url(#arrow)"/><text x="930" y="270" class="math">y ∈ {0,1}</text>
<rect x="105" y="405" width="450" height="125" rx="14" fill="#ffffff" stroke="#c7d8e9" stroke-width="2"/>
<text x="330" y="450" text-anchor="middle" class="math">z = w₁x₁ + w₂x₂ + b</text><text x="330" y="494" text-anchor="middle" class="small rtl">اول یک امتیاز خطی محاسبه می‌کنیم</text>
<rect x="620" y="385" width="465" height="165" rx="14" fill="#ffffff" stroke="#c7d8e9" stroke-width="2"/>
<text x="852" y="430" text-anchor="middle" class="maths">اگر  z ≤ 0  →  y = 0</text><text x="852" y="472" text-anchor="middle" class="maths">اگر  z &gt; 0  →  y = 1</text><text x="852" y="520" text-anchor="middle" class="small rtl">خروجی حالا یک کلاس دودویی است</text>
</svg>